# Netlify configuration for the PropManager marketing website.
#
# INTENT: The website lives in propmanager-website/ inside the app monorepo.
#         `base` scopes the build there; Netlify still clones the full repo,
#         which the changelog page needs (it reads the repo-root CHANGELOG.md).
# DECISION: Assets are fingerprinted by Astro under /_astro/ — cached forever.
#           HTML is revalidated on every request so releases show up instantly.

[build]
  base    = "propmanager-website"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Production canonical URL — override in the Netlify UI after attaching a
# custom domain. Deploy previews fall back to DEPLOY_PRIME_URL automatically
# (see astro.config.mjs).
[context.production.environment]
  SITE_URL = "https://property-manager-app.netlify.app"

# ---------- Security headers (all pages) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    # CAVEAT: 'unsafe-inline' script-src is required by the theme pre-paint
    # and scroll-reveal inline scripts; connect-src allows the download page
    # to query the GitHub Releases API.
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# ---------- Cache: fingerprinted assets are immutable ----------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons / OG image change rarely but are NOT fingerprinted — cache one day.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------- Redirects ----------
# Legacy screenshots folder (moved into src/assets) — send crawlers home.
[[redirects]]
  from   = "/screenshots/*"
  to     = "/"
  status = 301
